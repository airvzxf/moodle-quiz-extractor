name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Semanal (lunes, UTC) para detectar alertas nuevas aunque no haya cambios.
    - cron: "23 7 * * 1"
  workflow_dispatch:

# Mínimo privilegio: security-events sólo para subir el SARIF a
# Code scanning; el resto es de lectura.
permissions:
  contents: read

# Acciones fijadas por SHA (con la versión en el comentario); Dependabot
# las actualiza.
jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # JavaScript/TypeScript no necesita compilar (build-mode: none).
      # Se omiten las páginas HTML de prueba: son capturas de Moodle, no código
      # de la extensión.
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - "tests/fixtures/**"
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript
