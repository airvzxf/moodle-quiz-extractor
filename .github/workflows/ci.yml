name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: el token sólo lee el contenido del repositorio.
permissions:
  contents: read

# Un PR re-empujado cancela su ejecución anterior; en main no se cancela
# para que un fallo quede visible mientras llega el arreglo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Acciones fijadas por SHA (con la versión en el comentario); Dependabot
# las actualiza. Todas usan el runtime node24.
jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Binario Go descargado de la release oficial, con la versión explícita.
      - name: Instalar actionlint
        run: |
          set -euo pipefail
          ver=1.7.12
          curl -sSfL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: Revisar workflows
        run: actionlint -color

  check:
    name: Compilar, probar y empaquetar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lee la versión de pnpm de "packageManager" en package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm 12 no ejecuta "prepare" al instalar; genera .wxt/ (tipos).
      - run: pnpm exec wxt prepare
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm zip:firefox
      - run: pnpm zip:chrome
      # Los ZIP sirven para la lista de comprobación manual (M1–M8)
      # sin compilar en local. No son una release.
      - name: Subir los paquetes de la extensión
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-${{ github.sha }}
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Humo (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wxt prepare
      # Google Chrome estable ignora --load-extension; se usa el Chromium
      # que corresponde a la versión fijada de playwright-core.
      - name: Instalar Chromium de Playwright
        if: matrix.browser == 'chrome'
        run: |
          set -euo pipefail
          pnpm exec playwright-core install --with-deps chromium
          path=$(node -e "import('playwright-core').then(m => console.log(m.chromium.executablePath()))")
          echo "CHROMIUM_PATH=$path" >> "$GITHUB_ENV"
      # El runner trae Firefox estable preinstalado.
      - name: Localizar Firefox
        if: matrix.browser == 'firefox'
        run: |
          set -euo pipefail
          path=$(readlink -f "$(command -v firefox)")
          "$path" --version
          echo "FIREFOX_PATH=$path" >> "$GITHUB_ENV"
      - run: pnpm smoke:${{ matrix.browser }}
